# lab_6890 / amd-halo — standalone DB Connect lab validation spec.
# PostgreSQL 17 listens on 127.0.0.1:5436 (Debian cluster 17/main).
# Password file on host: /tmp/labval_dbx_pg_password (chmod 600, splunk-owned).

version: splunk-db-connect-setup/v1

platform:
  type: enterprise
  splunk_version: "10.4"
  stack: "amd-halo"

topology:
  mode: single_sh
  install_targets:
    - search-tier

install:
  install_apps: false
  accept_install: false
  db_connect_app_id: "2686"
  driver_app_ids:
    - "6150"
    - "6152"
  allow_archived_drivers: false
  local_packages: []

java:
  version: "17"
  java_home: /opt/java/openjdk-17
  jvm_options:
    - -Xms256m
    - -Xmx1024m

drivers:
  - name: mssql
    type: splunkbase
    splunkbase_id: "6150"
  - name: postgresql
    type: splunkbase
    splunkbase_id: "6152"

settings:
  task_server_port: 9998
  java_heap_size_mb: 1024
  query_timeout_seconds: 60
  max_rows_per_query: 50000
  enable_health_dashboard: true

identities:
  - name: labval_pg_identity
    username: labval_dbx
    password_file: /tmp/labval_dbx_pg_password
    secrets_provider: file

connections:
  - name: labval_pg_local
    driver: postgresql
    identity: labval_pg_identity
    jdbc_url: jdbc:postgresql://127.0.0.1:5436/labval_dbx
    require_client_cert: false

inputs:
  # Batch input: REST apply uses interval seconds (120) and timestampType=current.
  - name: labval_events_batch
    connection: labval_pg_local
    index: labval_dbx
    sourcetype: dbx:labval_events
    interval: "120"
    mode: batch
    query: |
      SELECT id, updated_at, event_type, message
      FROM public.labval_events
  # Rising input: apply via specs/lab6890-db-connect-apply-host.sh (checkpoint required).
  - name: labval_events_delta
    connection: labval_pg_local
    index: labval_dbx
    sourcetype: dbx:labval_events
    interval: "120"
    mode: rising
    checkpoint_column: updated_at
    query: |
      SELECT id, updated_at, event_type, message
      FROM public.labval_events
      WHERE updated_at > ?
      ORDER BY updated_at ASC

outputs: []
lookups: []
indexes:
  - name: labval_dbx
    datatype: event
    max_size_mb: 512

hec:
  enabled: false

cloud_network:
  outbound_allowlist: []

ha:
  enabled: false
  mode: none
  etcd_endpoints: []

security:
  fips_mode: false
  fips_fresh_install: false
  require_client_cert: false
  secret_policy: file_or_external_ref_only
  cyberark_enabled: false
  vault_enabled: false
  dbx_object_mutation: false

validation:
  run_rest_checks: true
  run_btool_checks: true
  run_spl_searches: false
  expected_sourcetypes: []

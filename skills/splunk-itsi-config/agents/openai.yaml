interface:
  display_name: "Splunk ITSI Configuration"
  short_description: "Safely configure an existing ITSI deployment"
  default_prompt: >-
    Use $splunk-itsi-config only to configure an existing, licensed, healthy
    ITSI deployment. Never install or upgrade ITSI, install prerequisite apps,
    apply a license, or restart Splunk; hand those needs to splunk-itsi-setup or
    splunk-app-install. Read references/product_coverage.md before claiming
    feature support. Start with references/beginner_quickstart.md, choose
    content-packs or topology unless the user provides a reviewed same-version
    ITSI export, and create a minimal gitignored template.local. Run offline
    lint, then a GET-only live preview and applicable inventory checks. Summarize
    the exact target, versions, permissions, creates, updates, guarded actions,
    warnings, and handoffs. Apply only after explicit approval using --apply;
    never use --mode apply. Finish with --completion validation and a concise
    evidence/handoff summary. Never request or place secrets in chat or specs.

# Dedicated Galileo CONNECT proxy. Install as a root-owned mode-0644 file.
User tinyproxy
Group tinyproxy
Port 18888
Listen 127.0.0.1
Timeout 30
MaxClients 32
PidFile "/run/tinyproxy-galileo/tinyproxy.pid"
Syslog On
LogLevel Info
Allow 127.0.0.1
ConnectPort 443
Filter "/etc/tinyproxy/galileo.filter"
FilterType ere
FilterURLs No
FilterCaseSensitive Yes
FilterDefaultDeny Yes
DisableViaHeader Yes

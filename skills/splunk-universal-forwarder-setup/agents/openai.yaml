interface:
  display_name: "Splunk Universal Forwarder Setup"
  short_description: "Bootstrap Universal Forwarders and enrollment assets"
  default_prompt: >-
    Use $splunk-universal-forwarder-setup to render and review Universal
    Forwarder bootstrap assets first, then require
    --accept-forwarder-mutation before any live Linux or macOS install, upgrade,
    or enrollment; render Windows handoffs and validate installed forwarders.

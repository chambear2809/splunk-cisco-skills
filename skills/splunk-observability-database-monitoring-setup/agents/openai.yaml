interface:
  display_name: "Splunk Observability Database Monitoring"
  short_description: "Deploy and verify production Splunk DBMon"
  default_prompt: "Use $splunk-observability-database-monitoring-setup to render and validate DBMon for Microsoft SQL Server, MySQL, MariaDB, MongoDB, Oracle Database, and provider/version-specific PostgreSQL. Enforce MongoDB 7.0 or Atlas M10+ limits for query samples, top queries, and plans; preserve MySQL/MariaDB plan gaps. Safely apply/roll back Kubernetes or Linux, or emit the reviewed fail-closed Windows handoff. Keep secrets protected, bind actions to a reviewed context and one scrape owner, prevent duplicate receivers, preserve resumable rollback state, and require identity-filtered telemetry plus applicable Infrastructure, DBMon UI, APM-correlation, and requested AI evidence before declaring success."

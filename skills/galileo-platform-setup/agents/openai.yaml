interface:
  display_name: "Galileo Platform Setup"
  short_description: "Operate a running Galileo application platform"
  default_prompt: "Use $galileo-platform-setup to operate application and Splunk workflows on an already-running Galileo instance; delegate On-Prem Kubernetes and packaged-service deployment to $galileo-on-prem-kubernetes-setup. Before tenant-specific work, ask for the Galileo instance console URL and pass it as --galileo-console-url."

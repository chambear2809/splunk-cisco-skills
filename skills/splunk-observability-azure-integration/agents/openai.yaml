interface:
  display_name: "Splunk Observability Cloud <-> Azure Integration"
  short_description: "Operate Splunk Observability Azure integrations"
  default_prompt: "Use $splunk-observability-azure-integration to render, validate, apply,\ndiscover, or diagnose the Splunk Observability Cloud Azure integration:\npolling via Azure Monitor API; Service Principal (tenantId + appId +\nsecretKey) via file-only delivery; azureEnvironment AZURE or\nAZURE_US_GOVERNMENT; per-subscription subscription list; services ~80-entry\nenum with additionalServices escape hatch; customNamespacesPerService for\nnon-standard namespaces; resourceFilterRules tag-based filtering;\nsyncGuestOsNamespaces; useBatchApi; importAzureMonitor; pollRate 60–600 s;\nnamedToken ForceNew warning; Terraform signalfx_azure_integration pinned to\nsplunk-terraform/signalfx ~> 9.0; Azure CLI SP creation + Monitoring Reader\n+ Reader role assignment scripts; Bicep role-assignment template; multi-\nsubscription and management-group-scoped role assignment; drift detection\nwith credential-hash sidecar (appId/secretKey redacted on GET); conflict\nmatrix (services non-empty, poll-rate bounds, namedToken ForceNew);\nGovCloud realm guard for AZURE_US_GOVERNMENT; and cross-skill handoffs to\nsplunk-app-install (Splunk_TA_microsoft-cloudservices Splunkbase 3110 logs),\nsplunk-observability-otel-collector-setup (AKS host telemetry),\nsplunk-observability-dashboard-builder (Azure dashboards), and\nsplunk-observability-native-ops (Azure detectors)."

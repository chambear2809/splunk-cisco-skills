interface:
  display_name: "Cisco Isovalent Platform Setup"
  short_description: "Install Isovalent Cilium and Tetragon on Kubernetes"
  default_prompt: "Use $cisco-isovalent-platform-setup to render and optionally apply the Kubernetes Cilium and Tetragon lifecycle, including OSS or Enterprise edition and optional Hubble Enterprise, DNSProxy, and Timescape add-ons. Review the feature catalog for explicit status of newer Isovalent Enterprise Networking, Runtime Security, Virtualization, and Load Balancer products; VM and standalone product paths may require customer documentation or handoff. Edition split via --edition oss|enterprise. The platform install is a prerequisite for splunk-observability-isovalent-integration."

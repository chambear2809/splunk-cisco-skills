interface:
  display_name: "Splunk Observability Cloud <-> GCP Integration"
  short_description: "Operate Splunk Observability GCP integrations"
  default_prompt: "Use $splunk-observability-gcp-integration to render, validate, apply,\ndiscover, or diagnose the Splunk Observability Cloud GCP integration:\npolling via Cloud Monitoring API; two authMethod values —\nSERVICE_ACCOUNT_KEY (projectServiceKeys with projectKey write-only,\nredacted on GET, file-based delivery via --key-file) or\nWORKLOAD_IDENTITY_FEDERATION (official Splunk-generated, mode-600\ngcp_wif_config.json delivered as compact/stringified JSON in\nworkloadIdentityFederationConfig; never fabricate realm principals,\npool IDs, or provider IDs); projects.syncMode; pollRate 60–600 s (wire in\nmilliseconds); useMetricSourceProjectForQuota (WARN: requires extra IAM\nrole); importGCPMetrics; services 32-entry enum (appengine, bigquery,\nbigtable, cloudfunctions, cloudiot, cloudsql, cloudtasks, composer,\ncompute, container, containeranalysis, dataflow, dataproc, dialogflow,\nfile, firebasedatabase, firebasehosting, firebasestorage, firestore,\niam, interconnect, knative, loadbalancing, logging, ml, pubsub, redis,\nrouter, run, spanner, storage, vpn); customMetricTypeDomains;\nexcludeGceInstancesWithLabels; namedToken ForceNew warning; Terraform\nsignalfx_gcp_integration handoff for Service Account key mode only;\nGCloud CLI SA creation + role binding scripts for SA mode; multi-project support;\ndrift detection with credential-hash sidecar (projectKey redacted on\nGET); conflict matrix (SA key vs WIF block, services mode, poll-rate\nbounds; WIF missing/corrupt/insecure-file preflight); and cross-skill handoffs to splunk-app-install\n(Splunk_TA_google_cloud Splunkbase 3088 logs), splunk-observability-\notel-collector-setup (GKE host telemetry), splunk-observability-\ndashboard-builder (GCP dashboards), and splunk-observability-native-ops\n(GCP detectors)."

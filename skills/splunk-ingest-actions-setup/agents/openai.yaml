interface:
  display_name: "Splunk Ingest Actions Setup"
  short_description: "Apply eval/mask/drop; stage route destinations"
  default_prompt: >-
    Use $splunk-ingest-actions-setup to apply eval, mask, and drop rules as
    props/transforms. For route-s3, stage only the RFS destination and require
    the explicit Splunk Web or supported rulesets-API rule handoff.

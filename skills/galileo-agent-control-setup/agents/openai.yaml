interface:
  display_name: "Galileo Agent Control Setup"
  short_description: "Operate Galileo Agent Control integrations"
  default_prompt: "Use $galileo-agent-control-setup for external Agent Control runtime, controls, SDK snippets, and sinks. Use $galileo-on-prem-agent-control-setup for Galileo's packaged Kubernetes service and $galileo-platform-setup for the Controls console. Before tenant-specific work, ask for the Galileo instance console URL and pass it as --galileo-console-url."

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14320

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
  transform/lemonade_client_semantics:
    error_mode: propagate
    trace_statements:
    - context: span
      statements:
      - set(span.attributes["llm.provider"], "lemonade") where span.attributes["openinference.span.kind"] == "LLM"
      - set(span.attributes["gen_ai.provider.name"], "lemonade") where span.attributes["openinference.span.kind"] == "LLM"
      - set(span.attributes["gen_ai.operation.name"], "chat") where span.attributes["openinference.span.kind"] == "LLM" and span.attributes["gen_ai.operation.name"] == nil
      - set(span.attributes["gen_ai.request.model"], span.attributes["llm.model_name"]) where span.attributes["openinference.span.kind"] == "LLM" and span.attributes["gen_ai.request.model"] == nil and span.attributes["llm.model_name"] != nil
      - set(span.attributes["gen_ai.response.model"], span.attributes["llm.model_name"]) where span.attributes["openinference.span.kind"] == "LLM" and span.attributes["gen_ai.response.model"] == nil and span.attributes["llm.model_name"] != nil
      - set(span.attributes["llm.input_messages.0.message.role"], "user") where span.attributes["openinference.span.kind"] == "LLM" and span.attributes["llm.input_messages.0.message.role"] == nil
      - set(span.attributes["llm.output_messages.0.message.role"], "assistant") where span.attributes["openinference.span.kind"] == "LLM" and span.attributes["llm.output_messages.0.message.role"] == nil
  transform/lemonade_client_privacy:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - delete_matching_keys(resource.attributes, "^(input[.]value|output[.]value|llm[.]invocation_parameters|llm[.]function_call([.].*)?|llm[.]tools([.].*)?|llm[.]prompts[.][0-9]+[.]prompt[.]text|llm[.]choices[.][0-9]+[.]completion[.]text|llm[.]prompt_template[.](template|variables)([.].*)?|llm[.](input|output)_messages[.][0-9]+[.]message[.]content|llm[.](input|output)_messages[.][0-9]+[.]message[.]contents[.][0-9]+[.]message_content[.](text|data|encrypted_content|signature)|llm[.](input|output)_messages[.][0-9]+[.]message[.]contents[.][0-9]+[.]message_content[.]image([.].*)?|llm[.](input|output)_messages[.][0-9]+[.]message[.]contents[.][0-9]+[.]message_content[.]audio([.].*)?|llm[.](input|output)_messages[.][0-9]+[.]message[.]function_call_arguments_json|llm[.](input|output)_messages[.][0-9]+[.]message[.]tool_calls[.][0-9]+[.]tool_call[.](function[.]arguments|reasoning_signature)|gen_ai[.](prompt|completion)|gen_ai[.](input|output)[.]messages($|[.][0-9]+[.](content|contents|parts)([.].*)?)|gen_ai[.]system_instructions([.].*)?|gen_ai[.]tool[.]definitions([.].*)?|gen_ai[.]tool[.](description|parameters|arguments)([.].*)?|gen_ai[.]tool[.]call[.](arguments|result)([.].*)?|gen_ai[.]retrieval[.](documents|query([.]text)?)([.].*)?|gen_ai[.](system|user|assistant|tool)[.]message([.].*)?|embedding[.]invocation_parameters|embedding[.]embeddings[.][0-9]+[.]embedding[.](text|vector)|(audio[.](url|transcript|data)|image[.]url|prompt[.]url)|tool[.](description|parameters|output|json_schema|schema)|retrieval[.]documents[.][0-9]+[.]document[.](content|metadata)|reranker[.]query|reranker[.](input|output)_documents[.][0-9]+[.]document[.](content|metadata)|metadata|user[.]id|tag[.]tags)$")
    - context: span
      statements:
      - delete_matching_keys(span.attributes, "^(input[.]value|output[.]value|llm[.]invocation_parameters|llm[.]function_call([.].*)?|llm[.]tools([.].*)?|llm[.]prompts[.][0-9]+[.]prompt[.]text|llm[.]choices[.][0-9]+[.]completion[.]text|llm[.]prompt_template[.](template|variables)([.].*)?|llm[.](input|output)_messages[.][0-9]+[.]message[.]content|llm[.](input|output)_messages[.][0-9]+[.]message[.]contents[.][0-9]+[.]message_content[.](text|data|encrypted_content|signature)|llm[.](input|output)_messages[.][0-9]+[.]message[.]contents[.][0-9]+[.]message_content[.]image([.].*)?|llm[.](input|output)_messages[.][0-9]+[.]message[.]contents[.][0-9]+[.]message_content[.]audio([.].*)?|llm[.](input|output)_messages[.][0-9]+[.]message[.]function_call_arguments_json|llm[.](input|output)_messages[.][0-9]+[.]message[.]tool_calls[.][0-9]+[.]tool_call[.](function[.]arguments|reasoning_signature)|gen_ai[.](prompt|completion)|gen_ai[.](input|output)[.]messages($|[.][0-9]+[.](content|contents|parts)([.].*)?)|gen_ai[.]system_instructions([.].*)?|gen_ai[.]tool[.]definitions([.].*)?|gen_ai[.]tool[.](description|parameters|arguments)([.].*)?|gen_ai[.]tool[.]call[.](arguments|result)([.].*)?|gen_ai[.]retrieval[.](documents|query([.]text)?)([.].*)?|gen_ai[.](system|user|assistant|tool)[.]message([.].*)?|embedding[.]invocation_parameters|embedding[.]embeddings[.][0-9]+[.]embedding[.](text|vector)|(audio[.](url|transcript|data)|image[.]url|prompt[.]url)|tool[.](description|parameters|output|json_schema|schema)|retrieval[.]documents[.][0-9]+[.]document[.](content|metadata)|reranker[.]query|reranker[.](input|output)_documents[.][0-9]+[.]document[.](content|metadata)|metadata|user[.]id|tag[.]tags)$")
      - set(span.attributes["input.value"], "[REDACTED]") where span.attributes["openinference.span.kind"] == "AGENT" or span.attributes["openinference.span.kind"] == "TOOL"
      - set(span.attributes["output.value"], "[REDACTED]") where span.attributes["openinference.span.kind"] == "AGENT" or span.attributes["openinference.span.kind"] == "TOOL"
      - set(span.attributes["gen_ai.tool.call.arguments"], "[REDACTED]") where span.attributes["openinference.span.kind"] == "TOOL"
      - set(span.attributes["gen_ai.tool.call.result"], "[REDACTED]") where span.attributes["openinference.span.kind"] == "TOOL"
      - set(span.status.message, "[REDACTED]") where span.status.code == STATUS_CODE_ERROR
      - set(span.attributes["error.type"], "lemonade.error") where span.status.code == STATUS_CODE_ERROR and span.attributes["error.type"] == nil
    - context: spanevent
      statements:
      - delete_matching_keys(spanevent.attributes, "(?i)^(gen_ai[.](input|output)[.]messages($|[.][0-9]+[.](content|contents|parts)([.].*)?)|gen_ai[.]system_instructions([.].*)?|gen_ai[.]tool[.]definitions([.].*)?|gen_ai[.].*(content|arguments|result|prompt|completion|description)([.].*)?|gen_ai[.]retrieval[.](documents|query([.]text)?)([.].*)?|llm[.].*(content|arguments|result)([.].*)?|tool[.](arguments|result|output|description|parameters)([.].*)?|(audio[.](url|transcript|data)|image[.]url|prompt[.]url))$")
      - set(spanevent.attributes["exception.message"], "[REDACTED]") where spanevent.name == "exception"
      - set(spanevent.attributes["exception.stacktrace"], "[REDACTED]") where spanevent.name == "exception" and spanevent.attributes["exception.stacktrace"] != nil
  transform/galileo_route_guard:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - delete_matching_keys(resource.attributes, "(?i)^galileo[.]")
    - context: span
      statements:
      - delete_matching_keys(span.attributes, "(?i)^galileo[.]")
    - context: spanevent
      statements:
      - delete_matching_keys(spanevent.attributes, "(?i)^galileo[.]")
  tail_sampling:
    sampling_strategy: trace-complete
    decision_wait: 40s
    num_traces: 10000
    block_on_overflow: true
    expected_new_traces_per_sec: 10
    decision_wait_after_root_received: 2s
    policies:
    - name: keep-all-lemonade-chats
      type: always_sample

exporters:
  otlp_http/galileo_native_bridge:
    traces_endpoint: http://127.0.0.1:14321/v1/traces
    compression: none
    timeout: 45s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 268435456
      block_on_overflow: true
      sizer: bytes
      storage: file_storage/galileo_native_bridge

extensions:
  health_check:
    endpoint: 127.0.0.1:13134
  file_storage/galileo_native_bridge:
    directory: /var/lib/splunk-otel-collector/galileo-amd-queue/cbe7b38b830c4159aa189be8ad8c0dadcabeb3f78868e48c875b86d544176a4b
    timeout: 10s
    max_size: 1073741824
    fsync: true
    create_directory: true
    directory_permissions: "0700"
    compaction:
      on_rebound: true
      directory: /var/lib/splunk-otel-collector/galileo-amd-queue/cbe7b38b830c4159aa189be8ad8c0dadcabeb3f78868e48c875b86d544176a4b/compaction
      rebound_needed_threshold_mib: 256
      rebound_trigger_threshold_mib: 64
      check_interval: 5m

service:
  extensions:
  - health_check
  - file_storage/galileo_native_bridge
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/lemonade_client_semantics
      - transform/lemonade_client_privacy
      - transform/galileo_route_guard
      - tail_sampling
      exporters:
      - otlp_http/galileo_native_bridge
  telemetry:
    logs:
      level: info
    resource:
      attributes:
      - name: otelcol.service.mode
        value: amd-native-sidecar
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8889

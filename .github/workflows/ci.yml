name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Python tests ──────────────────────────────────────────────────────
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-agent.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements-dev.txt -r requirements-agent.txt

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail

          # Security-sensitive runtime tests reject writable checkout ancestors
          # and interpreters. GitHub's hosted tool cache and work directory are
          # group-writable, so exercise the suite from owner-only sibling paths.
          # Keep pytest's interpreter and temporary files outside the checkout:
          # several tests intentionally reject secret-bearing output under a
          # repository root. A secondary repo-local venv supports tests that
          # explicitly exercise that conventional path without running pytest
          # through it.
          trusted_root="$(mktemp -d "${HOME}/splunk-cisco-skills-ci.XXXXXX")"
          trusted_workspace="${trusted_root}/workspace"
          trusted_venv="${trusted_root}/runner-venv"
          trusted_tmp="${trusted_root}/tmp"
          install -d -m 700 "${trusted_workspace}" "${trusted_tmp}"
          cp -a "${GITHUB_WORKSPACE}/." "${trusted_workspace}/"
          chmod go-w "${HOME}" "${trusted_root}" "${trusted_workspace}"
          python -m venv --copies --system-site-packages "${trusted_venv}"
          python -m venv --copies --system-site-packages "${trusted_workspace}/.venv"
          trusted_python="$(readlink -f "${trusted_venv}/bin/python")"
          chmod go-w \
            "${trusted_python}" \
            "$(readlink -f "${trusted_workspace}/.venv/bin/python3")"

          cd "${trusted_workspace}"
          PATH="${trusted_venv}/bin:${PATH}" \
            TMPDIR="${trusted_tmp}" \
            "${trusted_python}" -m pytest tests/ -v

      - name: Import local MCP agent server
        run: python3 -c "import agent.splunk_cisco_skills_mcp.server; print('local MCP agent import ok')"

      - name: Audit MCP runtime dependencies
        run: >-
          PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple
          pip-audit -r requirements-agent.txt --progress-spinner off
          --index-url https://pypi.org/simple

  # Exercise the MCP stdio contract at both ends of the supported Python range.
  mcp-protocol-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-agent.txt

      - name: Install MCP compatibility dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements-dev.txt -r requirements-agent.txt

      - name: Run MCP protocol tests
        run: pytest tests/test_agent_mcp_protocol.py -v

  # ── Bats tests ────────────────────────────────────────────────────────
  bats-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run Bats tests
        run: bats tests/*.bats

  # ── Secret scanning ──────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA256 from the official v8.30.1 release checksum manifest:
      # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan tracked tree and complete git history
        run: >-
          python3 scripts/run_secret_scan.py
          --gitleaks "${RUNNER_TEMP}/gitleaks"

  # ── ShellCheck + syntax ───────────────────────────────────────────────
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: "0.10.0"
      # SHA256 of shellcheck-v0.10.0.linux.x86_64.tar.xz from
      # https://github.com/koalaman/shellcheck/releases/tag/v0.10.0
      # Update this hash whenever SHELLCHECK_VERSION changes.
      SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSL --fail \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            -o "${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "${archive}" --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm -f "${archive}"
          shellcheck --version

      - name: Syntax-check shell scripts
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          roots = (Path("agent"), Path("skills"), Path("scripts"))
          files = sorted(str(path) for root in roots for path in root.rglob("*.sh"))
          if not files:
              raise SystemExit("No first-party shell scripts found")

          for file_path in files:
              subprocess.run(["bash", "-n", file_path], check=True)
          PY

      - name: ShellCheck first-party scripts
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          roots = (Path("agent"), Path("skills"), Path("scripts"))
          files = sorted(str(path) for root in roots for path in root.rglob("*.sh"))
          if not files:
              raise SystemExit("No first-party shell scripts found")

          subprocess.run(["shellcheck", "--severity=warning", *files], check=True)
          PY

  # ── Validation (lints, schema checks, freshness) ─────────────────────
  validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install validation tools
        run: pip install -r requirements-dev.txt

      - name: Validate all tracked JSON and YAML
        run: python3 scripts/validate_tracked_configs.py --yamllint

      - name: Lint Python with ruff
        run: ruff check skills/ tests/ agent/ scripts/

      - name: Check catalog freshness
        run: python3 skills/cisco-product-setup/scripts/build_catalog.py --check

      - name: Check canonical skill manifest surfaces
        run: python3 skills/shared/scripts/generate_skill_catalog.py --check

      - name: Check deployment docs freshness
        run: python3 skills/shared/scripts/generate_deployment_docs.py --check

      - name: Check skill UX, validation, and Splunk 10.5 compatibility docs
        run: |
          python3 skills/shared/scripts/generate_skill_ux_catalog.py --check
          python3 skills/shared/scripts/generate_skill_validation_matrix.py --check
          python3 skills/shared/scripts/audit_skill_compatibility.py
          python3 skills/shared/scripts/generate_splunk_10_5_compatibility.py --check

      - name: Check SKILL.md frontmatter
        run: python3 tests/check_skill_frontmatter.py

      - name: Check repository readiness
        run: python3 tests/check_repo_readiness.py

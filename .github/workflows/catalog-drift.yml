name: Catalog drift audit

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-drift-audit
  cancel-in-progress: false

jobs:
  splunkbase-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare registry with live Splunkbase listings
        run: >-
          python3 skills/shared/scripts/audit_splunkbase_registry.py
          --live --json --max-workers 12

  scan-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned SCAN catalog provenance with the public source
        run: >-
          python3 skills/cisco-product-setup/scripts/build_catalog.py
          --check-live-source

  lifecycle-qualifier-urls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect vendor lifecycle drift behind preview/beta/alpha doc URLs
        run: >-
          python3 skills/shared/scripts/audit_lifecycle_qualifier_urls.py
          --max-workers 12 --timeout 20

  documentation-urls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect dead public documentation citations across the repository
        run: >-
          python3 skills/shared/scripts/audit_documentation_urls.py
          --max-workers 16 --timeout 15

  galileo-product-and-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the Galileo MCP server with the pinned tool catalog
        run: >-
          python3 skills/galileo-mcp-server-setup/scripts/probe_mcp.py
          --fail-on-drift --json

      - name: Detect new Galileo releases and product coverage gaps
        run: >-
          python3 skills/galileo-mcp-server-setup/scripts/audit_product_coverage.py
          --json

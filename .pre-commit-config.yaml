# Pre-commit hooks for the splunk-cisco-skills repo.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against the whole tree:
#   pre-commit run --all-files
#
# These hooks chain the same checks documented in CONTRIBUTING.md so
# contributors get fast local feedback before pushing. The hooks are
# intentionally fast (lint + structural validators); the full pytest /
# bats / shellcheck suite is left to CI and to the explicit commands in
# CONTRIBUTING.md.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            splunk-mcp-rendered/.*|
            splunk-observability-dashboard-rendered/.*
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            splunk-mcp-rendered/.*|
            splunk-observability-dashboard-rendered/.*
          )$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-json
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Render-time {{TOKEN}} templates are parsed after constrained
        # placeholder normalization by validate_tracked_configs.py.
        exclude: |
          (?x)^(
            skills/splunk-connect-for-snmp-setup/templates/compose/docker-compose\.yml|
            skills/splunk-connect-for-snmp-setup/templates/kubernetes/(namespace|values)\.yaml|
            skills/splunk-connect-for-syslog-setup/templates/host/docker-compose\.yml|
            skills/splunk-connect-for-syslog-setup/templates/kubernetes/(namespace|values)\.yaml
          )$
      - id: check-symlinks
      - id: detect-private-key
        # These files intentionally contain PEM boundary syntax in validators,
        # renderers, documentation, or synthetic security tests. Gitleaks still
        # scans every one of them.
        exclude: |
          (?x)^(
            agent/splunk_cisco_skills_mcp/core\.py|
            skills/galileo-on-prem-stack-setup/scripts/self_test\.py|
            skills/splunk-admin-doctor/scripts/(doctor|live_validate_all)\.py|
            skills/splunk-ingest-processor-setup/scripts/(render_assets\.py|smoke_offline\.sh)|
            skills/splunk-observability-cisco-intersight-integration/(references/intersight-secrets\.md|scripts/render_assets\.py)|
            skills/splunk-observability-cisco-nexus-integration/scripts/render_assets\.py|
            skills/splunk-observability-otel-collector-setup/scripts/render_assets\.py|
            skills/splunk-platform-pki-setup/(reference\.md|references/(edge-processor-pki|key-format-and-permissions)\.md|scripts/render_assets\.py)|
            tests/(test_agent_mcp_core|test_cisco_collaboration_setup|test_live_validation_runner|test_splunk_admin_doctor|test_splunk_enterprise_kubernetes_setup|test_splunk_enterprise_security_config|test_splunk_ingest_processor_setup|test_splunk_observability_azure_integration|test_splunk_observability_gcp_integration|test_splunk_observability_otel_collector_setup)\.py
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: bash-syntax
        name: bash -n on all first-party shell scripts
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        files: ^(agent|scripts|skills)/.*\.sh$

      - id: skill-frontmatter
        name: Agent Skills SKILL.md contract
        entry: python3 tests/check_skill_frontmatter.py
        language: system
        pass_filenames: false
        files: ^skills/(catalog\.yaml|.*/SKILL\.md)$

      - id: repo-readiness
        name: Repository readiness (catalog parity, symlinks, gitignore)
        entry: python3 tests/check_repo_readiness.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            README\.md|
            AGENTS\.md|
            CLAUDE\.md|
            \.mcp\.json|
            \.gitleaks-baseline\.json|
            \.gitleaksignore|
            \.cursor/mcp\.json|
            \.cursor/skills/.*|
            \.claude/commands/.*|
            agent/.*|
            scripts/.*|
            skills/.*|
            requirements-agent\.txt|
            CHANGELOG\.md|
            CONTRIBUTING\.md|
            SECURITY\.md|
            \.gitattributes
          )$

      - id: canonical-skill-catalog-fresh
        name: Canonical skill manifest and direct generated surfaces
        entry: python3 skills/shared/scripts/generate_skill_catalog.py --check
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            AGENTS\.md|
            CLAUDE\.md|
            SKILL_REQUIREMENTS\.md|
            \.claude/commands/.*|
            \.cursor/skills/.*|
            skills/catalog\.yaml|
            skills/shared/deprecated_skill_aliases\.md|
            skills/[^/]+/(SKILL\.md|agents/openai\.yaml)|
            skills/shared/(app_registry|skill_product_registry|skill_validation_registry)\.json|
            skills/shared/skill_(catalog|validation)(\.schema\.json|\.py)?|
            skills/shared/scripts/generate_skill_catalog\.py
          )$

      - id: skill-ux-catalog-fresh
        name: Product-first skill UX catalog freshness
        entry: python3 skills/shared/scripts/generate_skill_ux_catalog.py --check
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            SKILL_UX_CATALOG\.md|
            skills/catalog\.yaml|
            skills/[^/]+/(SKILL\.md|reference\.md|references/.*|templates?/.*|scripts/.*)|
            skills/shared/skill_product_registry\.json|
            skills/shared/scripts/generate_skill_ux_catalog\.py
          )$

      - id: deployment-docs-fresh
        name: generate_deployment_docs.py --check (registry vs generated docs)
        entry: python3 skills/shared/scripts/generate_deployment_docs.py --check
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            skills/shared/app_registry\.json|
            skills/catalog\.yaml|
            skills/shared/scripts/generate_deployment_docs\.py|
            CLOUD_DEPLOYMENT_MATRIX\.md|
            DEPLOYMENT_ROLE_MATRIX\.md
          )$

      - id: skill-validation-matrix-fresh
        name: Skill validation registry and matrix freshness
        entry: python3 skills/shared/scripts/generate_skill_validation_matrix.py --check
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            SKILL_VALIDATION_MATRIX\.md|
            skills/catalog\.yaml|
            skills/.*/SKILL\.md|
            skills/.*/scripts/.*|
            skills/shared/skill_validation_registry\.json|
            skills/shared/skill_validation\.py|
            skills/shared/scripts/(audit|generate)_skill_validation\.py|
            tests/test_.*\.(py|bats)
          )$

      - id: splunk-compatibility-fresh
        name: Splunk 10.5 compatibility matrix freshness
        entry: python3 skills/shared/scripts/generate_splunk_10_5_compatibility.py --check
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            SPLUNK_10_5_COMPATIBILITY\.md|
            skills/catalog\.yaml|
            skills/[^/]+/SKILL\.md|
            skills/shared/app_registry\.json|
            skills/shared/references/splunk_platform_versions\.json|
            skills/shared/scripts/(audit_skill_compatibility|generate_splunk_10_5_compatibility)\.py
          )$

      - id: ruff-lint
        name: ruff (Python lint)
        entry: ruff check
        language: system
        pass_filenames: false
        files: \.py$
        args: [skills/, tests/, agent/, scripts/]

      - id: tracked-config-validation
        name: Parse tracked JSON/YAML and lint tracked YAML
        entry: python3 scripts/validate_tracked_configs.py --yamllint
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            \.yamllint\.yml|
            \.pre-commit-config\.yaml|
            scripts/validate_tracked_configs\.py|
            .*\.json|
            .*\.ya?ml
          )$
